<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статистика — Task Planner</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/stats.css">
</head>
<body>
  <header class="site-header"><a class="logo" href="index.html">Task Planner</a><nav><a href="index.html">Планировщик</a><a href="stats.html" class="active">Статистика</a></nav><button id="randomBtn" class="btn">🎲 Случайная задача</button></header>
  <main class="container">
    <section id="metrics" class="metrics"></section>
    <div class="rank-head">
      <h2>Самые загруженные пользователи</h2>
      <div class="sort">
        <button class="sort-btn active" data-sort="total">По числу задач</button>
        <button class="sort-btn" data-sort="percent">По проценту выполнения</button>
      </div>
    </div>
    <div id="ranking" class="ranking"></div>
    <section id="userTasks" class="user-tasks"></section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
